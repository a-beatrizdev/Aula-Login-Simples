<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Portal SENAI | Início</title>
    <style>
        :root {
            --vermelho-senai: #ff0000;
            --vermelho-hover: #d10000;
            --cinza-fundo: #f4f4f4;
            --branco: #ffffff;
            --texto-principal: #333;
        }

        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background-color: var(--cinza-fundo);
            margin: 0;
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
        }

        .welcome-card {
            background-color: var(--branco);
            width: 100%;
            max-width: 400px;
            padding: 50px 40px;
            border-radius: 12px;
            box-shadow: 0 10px 30px rgba(0, 0, 0, 0.1);
            border-bottom: 8px solid var(--vermelho-senai);
            text-align: center;
        }

        .logo-senai {
            color: var(--vermelho-senai);
            font-size: 42px;
            font-weight: 900;
            letter-spacing: -3px;
            margin-bottom: 10px;
        }

        h1 {
            font-size: 1.4rem;
            color: var(--texto-principal);
            margin-bottom: 10px;
        }

        p {
            color: #666;
            margin-bottom: 40px;
            font-size: 0.95rem;
            line-height: 1.5;
        }

        .button-group {
            display: flex;
            flex-direction: column;
            gap: 15px;
        }

        /* Botão de Entrar - Principal (Sólido) */
        .btn {
            display: block;
            padding: 15px;
            border-radius: 6px;
            font-weight: bold;
            text-transform: uppercase;
            text-decoration: none;
            font-size: 1rem;
            transition: all 0.3s ease;
        }

        .btn-login {
            background-color: var(--vermelho-senai);
            color: white;
            border: none;
        }

        .btn-login:hover {
            background-color: var(--vermelho-hover);
            transform: translateY(-2px);
        }

        /* Botão de Cadastrar - Secundário (Borda) */
        .btn-register {
            background-color: transparent;
            color: var(--vermelho-senai);
            border: 2px solid var(--vermelho-senai);
        }

        .btn-register:hover {
            background-color: var(--vermelho-senai);
            color: white;
        }

        .footer-info {
            margin-top: 40px;
            font-size: 0.75rem;
            color: #999;
            text-transform: uppercase;
            letter-spacing: 1px;
        }
    </style>
</head>
<body>

    <div class="welcome-card">
        <div class="logo-senai">SENAI</div>
        <h1>Seja bem-vindo</h1>
        <p>Acesse a plataforma de ensino e gestão da indústria brasileira.</p>

        <div class="button-group">
            <a href="login.html" class="btn btn-login">Entrar no Sistema</a>
            
            <a href="cadastro.html" class="btn btn-register">Criar Nova Conta</a>
        </div>

        <div class="footer-info">
            &copy; 2026 SENAI - Tecnologia e Inovação
        </div>
    </div>

</body>
</html>
