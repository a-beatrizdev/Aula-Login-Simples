<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login | SENAI</title>
    <style>
        :root {
            --vermelho-senai: #ff0000;
            --vermelho-hover: #d10000;
            --cinza-fundo: #f4f4f4;
            --branco: #ffffff;
            --texto-principal: #333;
            --borda: #ccc;
        }

        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background-color: var(--cinza-fundo);
            margin: 0;
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
        }

        .login-container {
            background-color: var(--branco);
            width: 100%;
            max-width: 360px;
            padding: 40px;
            border-radius: 12px;
            box-shadow: 0 8px 24px rgba(0, 0, 0, 0.1);
            border-bottom: 6px solid var(--vermelho-senai); /* Detalhe inferior no tema vermelho */
            text-align: center;
        }

        .logo-senai {
            color: var(--vermelho-senai);
            font-size: 32px;
            font-weight: 900;
            letter-spacing: -2px;
            margin: 0;
            line-height: 1;
        }

        h1 {
            font-size: 1.1rem;
            color: #666;
            margin-bottom: 30px;
            text-transform: uppercase;
            letter-spacing: 1px;
        }

        .form-group {
            text-align: left;
            margin-bottom: 20px;
        }

        label {
            display: block;
            font-weight: 600;
            font-size: 0.85rem;
            margin-bottom: 8px;
            color: var(--texto-principal);
        }

        input {
            width: 100%;
            padding: 12px 15px;
            border: 1px solid var(--borda);
            border-radius: 6px;
            box-sizing: border-box;
            font-size: 1rem;
            transition: all 0.2s ease-in-out;
        }

        input:focus {
            outline: none;
            border-color: var(--vermelho-senai);
            box-shadow: 0 0 0 3px rgba(255, 0, 0, 0.1);
        }

        .btn-entrar {
            width: 100%;
            padding: 14px;
            background-color: var(--vermelho-senai);
            color: white;
            border: none;
            border-radius: 6px;
            font-weight: bold;
            font-size: 1rem;
            cursor: pointer;
            text-transform: uppercase;
            transition: background 0.3s;
            margin-top: 10px;
        }

        .btn-entrar:hover {
            background-color: var(--vermelho-hover);
        }

        .opcoes-adicionais {
            margin-top: 25px;
            font-size: 0.9rem;
            color: #777;
        }

        .opcoes-adicionais a {
            color: var(--vermelho-senai);
            text-decoration: none;
            font-weight: bold;
        }

        .opcoes-adicionais a:hover {
            text-decoration: underline;
        }

        .forgot-password {
            display: block;
            margin-top: 10px;
            font-size: 0.8rem;
            color: #999;
        }
    </style>
</head>
<body>

    <div class="login-container">
        <div class="logo-senai">SENAI</div>
        <h1>Acesso ao Sistema</h1>

        <form action="/login" method="post">
            <div class="form-group">
                <label for="email">E-mail</label>
                <input type="email" id="email" name="email" placeholder="seu@email.com" required>
            </div>

            <div class="form-group">
                <label for="senha">Senha</label>
                <input type="password" id="senha" name="senha" placeholder="Sua senha" required>
            </div>

            <button type="submit" class="btn-entrar">Entrar</button>
            
            <a href="#" class="forgot-password">Esqueceu sua senha?</a>
        </form>

        <div class="opcoes-adicionais">
            Ainda não tem conta? <br>
            <a href="/cadastro">Criar nova conta</a>
        </div>
    </div>

</body>
</html>
